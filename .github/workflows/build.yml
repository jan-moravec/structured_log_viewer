name: Build

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:
    inputs:
      lto:
        description: "Build with IPO/LTO and run the benchmarks (always on for main, release/** and tags)"
        type: boolean
        default: false

permissions:
  contents: read

# Cancel superseded PR runs; let push/tag runs finish so we never abort a
# half-published release. `run_id` fallback gives each push its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # IPO/LTO for the `release` preset jobs. LTO links of the ~20 test
  # executables dominate the build, so pull requests skip it by default.
  # It is forced on for main, release/** and tags, which publish the
  # binaries. A PR opts in with the `lto` label (takes effect on the next
  # push) and a manual run with the `lto` input. Benchmarks run only with
  # LTO so their numbers stay comparable to the shipped build.
  SLV_LTO: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/') || inputs.lto || contains(github.event.pull_request.labels.*.name, 'lto')) && 'ON' || 'OFF' }}
  # sccache caches object files in the GitHub Actions cache. CMake picks the
  # launcher up from the environment and leaves it out of
  # compile_commands.json, so clang-tidy is unaffected. A cache outage falls
  # back to plain compilation instead of failing the build.
  # Tag builds publish releases, so they compile from scratch rather than
  # trust objects cached by earlier runs.
  SCCACHE_GHA_ENABLED: ${{ startsWith(github.ref, 'refs/tags/') && 'false' || 'true' }}
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache
  # Only LTS lines are used: 6.12 here (Linux, macOS) and 6.8 on Windows.
  QT_VERSION: "6.12.*"
  # Windows stays on 6.8 LTS: aqtinstall 3.3.0 cannot install Windows Qt 6.11+
  # (new per-package repository layout, miurahr/aqtinstall#1047). Move it to
  # QT_VERSION once a fixed aqtinstall ships.
  QT_VERSION_WINDOWS: "6.8.*"
  APP_NAME: "StructuredLogViewer"

jobs:
  pre-commit:
    # Fails fast on formatting / lint issues before any expensive build runs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Cache pre-commit environments
        # Resolved Python version in the key so a runner-image 3.12 -> 3.13
        # bump invalidates venvs with stale interpreter paths. Only lint
        # tools come from this cache; nothing in it reaches a release.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: pip install pre-commit==4.7.0

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always


  clang-ci:
    # Clang 23 matrix:
    #   asan-ubsan -> AddressSanitizer + UBSan
    #   tsan       -> ThreadSanitizer (excludes apptest; Qt trips it)
    #   coverage   -> source-based coverage + Codecov upload; also runs
    #                 cpp-linter-action against the build's compile_commands.json.
    # Coverage uploads tokenlessly via OIDC; the Codecov GitHub App must be
    # installed on the repo (fail_ci_if_error=true catches a misconfigured app).
    needs: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      # pull-requests: write lets cpp-linter-action post its tidy comment
      # on PRs; id-token: write enables tokenless Codecov OIDC upload;
      # contents: read is inherited.
      contents: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        mode: [asan-ubsan, tsan, coverage]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Clang 23 + LLVM tools
        # llvm.sh 23 all installs clang-23, clang-tidy-23, llvm-profdata/cov-23,
        # sanitizer runtimes, libc++-23-dev. The compiler is pinned via the
        # preset's CMAKE_C(XX)_COMPILER, not apt's default `clang` symlink.
        # Script is vendored under scripts/ci so CI does not downloadThenRun.
        run: |
          set -euo pipefail
          chmod +x scripts/ci/llvm.sh
          sudo ./scripts/ci/llvm.sh 23 all
          clang-23 --version
          clang-tidy-23 --version
          llvm-cov-23 --version
          which clang-tidy-diff-23.py

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          # libssl-dev: find_package(OpenSSL); libxcb-cursor0: offscreen QPA.
          apt-packages: libssl-dev libxcb-cursor0
          qt-version: ${{ env.QT_VERSION }}
          qt-host: linux
          qt-arch: linux_gcc_64

      - name: Configure
        # TLS pinned ON so TcpServerProducer + asio::ssl is in scope for tidy/sanitizers.
        run: cmake --preset clang-${{ matrix.mode }} -DLOGLIB_NETWORK_TLS=ON

      - name: Build
        run: cmake --build --preset clang-${{ matrix.mode }}

      - name: Collect clang-tidy include paths
        # Headers are not entries in compile_commands.json, so clang-tidy run
        # directly on a changed `.hpp` needs the include roots spelled out.
        # They are read from the compile database, so new dependencies are
        # picked up automatically.
        if: matrix.mode == 'coverage'
        id: tidy-args
        run: |
          set -euo pipefail
          ARGS="$(python3 scripts/ci/tidy-include-args.py build/clang-coverage \
            library/include app/include cli/include test/common/include test/log_generator/include)"
          echo "extra-args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run clang-tidy on PR changes
        # Coverage leg only, after the build so AUTOMOC/AUTOUIC/AUTORCC outputs
        # exist (without them clang-tidy fails with "<file>.moc: file not found").
        # style/tidy-checks empty -> defer to pre-commit and .clang-tidy.
        # Findings are listed in the PR comment and step summary (no inline
        # review: 100s of suggestions trip GitHub's secondary rate limit) and
        # fail the job through the "Fail on clang-tidy findings" step.
        # SHA-pinned so a tag re-cut can't change what we run.
        if: matrix.mode == 'coverage'
        id: cpp-linter
        uses: cpp-linter/cpp-linter-action@774040af57f011a5fc47911f08ff0c3059d1835a # v2.24.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "23"
          style: ""
          tidy-checks: ""
          database: build/clang-coverage
          extensions: cpp,hpp,h,cc
          files-changed-only: true
          lines-changed-only: true
          tidy-review: false
          thread-comments: true
          step-summary: true
          extra-args: ${{ steps.tidy-args.outputs.extra-args }}

      - name: Run tests
        # Sanitizer + LLVM_PROFILE_FILE env comes from the preset.
        run: ctest --preset clang-${{ matrix.mode }}

      - name: Merge coverage profiles + export lcov
        if: matrix.mode == 'coverage'
        run: scripts/ci/export-coverage.sh

      - name: Upload coverage to Codecov
        # Tokenless OIDC upload via the Codecov GitHub App (installed on the repo).
        # fail_ci_if_error: a broken upload (e.g. app uninstalled) fails the leg
        # loudly instead of silently producing zero-coverage runs.
        # SHA-pinned so a tag re-cut can't change what we run.
        # v7.0.0: ships the new `codecovsecops` GPG key after Codecov's
        # `codecovsecurity` keybase migration left the wrapper unable to verify
        # the uploader binary's signature on `v6.0.1` and earlier.
        if: matrix.mode == 'coverage'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.lcov
          fail_ci_if_error: true
          verbose: true
          use_oidc: true

      - name: Fail on clang-tidy findings
        # Last step so tests and the coverage upload still run when tidy reports.
        if: matrix.mode == 'coverage' && steps.cpp-linter.outputs.clang-tidy-checks-failed != '0'
        env:
          TIDY_FAILED: ${{ steps.cpp-linter.outputs.clang-tidy-checks-failed }}
        run: |
          echo "clang-tidy reported $TIDY_FAILED finding(s) on changed lines; see the step summary." >&2
          exit 1

  build-qt-free:
    needs: pre-commit
    # Proves `slp` configures, builds, and tests with no Qt installed.
    # The packaging jobs still build the GUI; this job is the one that
    # fails if `find_package(Qt6)` leaks out of `app/`.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          gcc13: true
          apt-packages: libssl-dev

      - name: Configure without Qt
        run: cmake --preset release -DSLV_BUILD_GUI=OFF -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE="$SLV_LTO"

      - name: Build
        run: cmake --build --preset release

      - name: Run tests
        run: ctest --preset release

  build-linux:
    needs: pre-commit
    # Oldest supported runner so the AppImage links against an older glibc
    # and stays compatible with Ubuntu 22.04 / equivalent distros.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # Qt 6.10+ ships a single Wayland platform plugin.
      EXTRA_PLATFORM_PLUGINS: "libqwayland.so"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          gcc13: true
          # libssl-dev: find_package(OpenSSL); libfuse2: AppImage runtime;
          # libxcb-cursor0: still loaded by the offscreen QPA; zsync: delta
          # updates; patchelf: points the slp tarball's binary at its bundled
          # libraries.
          apt-packages: libfuse2 libxcb-cursor0 zsync libssl-dev patchelf
          qt-version: ${{ env.QT_VERSION }}
          qt-host: linux
          qt-arch: linux_gcc_64

      - name: Configure
        # TLS pinned ON so the published AppImage can't silently lose it.
        run: cmake --preset release -DLOGLIB_NETWORK_TLS=ON -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE="$SLV_LTO"

      - name: Build
        run: cmake --build --preset release

      - name: Assert slp does not link Qt
        run: scripts/ci/assert-no-qt.sh build/release/bin/Release/slp

      - name: Run unit tests
        # release preset excludes the `benchmark` label; benchmarks run below.
        run: ctest --preset release

      - name: Run parser benchmarks
        if: env.SLV_LTO == 'ON'
        run: ctest --preset release-benchmark

      - name: Package AppImage
        env:
          # Enables delta/zsync updates; linuxdeploy embeds this entry and
          # writes a sibling .zsync file.
          UPDATE_INFORMATION: "gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|${{ env.APP_NAME }}-*x86_64.AppImage.zsync"
        run: scripts/ci/package-appimage.sh

      - name: Check AppImage
        run: scripts/ci/check-appimage.sh

      - name: Package slp tarball
        run: scripts/ci/package-slp-tarball.sh

      - name: Check slp tarball
        run: scripts/ci/check-slp-tarball.sh "$SLP_TARBALL"

      - name: Compute SHA256 checksums
        run: scripts/ci/write-checksums.sh "$APP_NAME"-*.AppImage "$APP_NAME"-*.AppImage.zsync "$SLP_TARBALL"

      - name: Upload artifact
        # No `if: always()`: with `if-no-files-found: error` it would pile a
        # second failure on top of an earlier build failure. Pull request
        # builds are kept for a week; 0 means the repository default.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APP_NAME }}-linux
          path: |
            ${{ env.APP_NAME }}-*.AppImage
            ${{ env.APP_NAME }}-*.AppImage.zsync
            ${{ env.APP_NAME }}-*.AppImage.sha256
            ${{ env.APP_NAME }}-*.AppImage.zsync.sha256
            slp-*-linux-x86_64.tar.gz
            slp-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 0 }}

  build-windows:
    needs: pre-commit
    runs-on: windows-latest
    timeout-minutes: 70
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          qt-version: ${{ env.QT_VERSION_WINDOWS }}
          qt-host: windows
          qt-arch: win64_msvc2022_64

      - name: Set up MSVC environment
        # vswhere-based discovery so we don't hard-code a VS edition path
        # (the hosted image has flipped Community <-> Enterprise before).
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Locate OpenSSL
        run: scripts/ci/find-openssl.ps1

      - name: Configure
        # TLS pinned ON so the published binary can't silently lose it.
        run: cmake --preset release -DLOGLIB_NETWORK_TLS=ON -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE="$env:SLV_LTO"

      - name: Build
        run: cmake --build --preset release

      - name: Assert slp does not link Qt
        run: |
          $slp = "build\release\bin\Release\slp.exe"
          if (-not (Test-Path $slp)) { throw "slp.exe was not built" }
          $deps = & dumpbin /dependents $slp | Out-String
          if ($deps -match 'Qt6') { throw "slp links Qt: $deps" }

      - name: Run unit tests
        run: ctest --preset release

      - name: Run parser benchmarks
        if: env.SLV_LTO == 'ON'
        run: ctest --preset release-benchmark

      - name: Package application
        run: scripts/ci/package-windows.ps1

      - name: Check packaged application
        run: scripts/ci/check-windows-package.ps1

      - name: Compute SHA256 checksums
        shell: bash
        run: bash scripts/ci/write-checksums.sh "$APP_NAME.zip"

      - name: Upload artifact
        # See build-linux for the `if: always()` and retention choices.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APP_NAME }}-windows
          path: |
            ${{ env.APP_NAME }}.zip
            ${{ env.APP_NAME }}.zip.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 0 }}

  build-macos:
    needs: pre-commit
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          qt-version: ${{ env.QT_VERSION }}
          qt-host: mac
          qt-arch: clang_64

      - name: Locate OpenSSL
        run: scripts/ci/find-openssl.sh

      - name: Configure
        # TLS pinned ON so the published DMG can't silently lose it.
        run: cmake --preset release -DLOGLIB_NETWORK_TLS=ON -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE="$SLV_LTO"

      - name: Build
        run: cmake --build --preset release

      - name: Assert slp does not link Qt
        run: scripts/ci/assert-no-qt.sh build/release/bin/Release/slp

      - name: Run unit tests
        run: ctest --preset release

      - name: Run parser benchmarks
        if: env.SLV_LTO == 'ON'
        run: ctest --preset release-benchmark

      - name: Package DMG
        run: scripts/ci/package-macos.sh

      - name: Check DMG
        run: scripts/ci/check-macos-dmg.sh

      - name: Compute SHA256 checksums
        run: scripts/ci/write-checksums.sh "$APP_NAME.dmg"

      - name: Upload artifact
        # See build-linux for the `if: always()` and retention choices.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APP_NAME }}-macos
          path: |
            ${{ env.APP_NAME }}.dmg
            ${{ env.APP_NAME }}.dmg.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 0 }}

  release:
    # Publishes one GitHub Release from the three platform artifacts once
    # every job has passed, so a tag never gets a partial release. This is
    # the only job with write access to the repository contents.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [clang-ci, build-qt-free, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ env.APP_NAME }}-*
          path: dist
          merge-multiple: true

      - name: Release binaries
        # Creates the release for the tag, or replaces its files when the job
        # is re-run.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          fi
