name: Build

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:
    inputs:
      lto:
        description: "Build with LTO and run the benchmarks (always on for main, release/** and tags)"
        type: boolean
        default: false

permissions:
  contents: read

# Cancel outdated PR runs. Push and tag runs always finish, so a release is never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # LTO for the `release` preset. It is always on for main, release/** and tags, which publish binaries. PRs skip it
  # because the LTO links are slow; add the `lto` label (next push) or run manually with `lto` to enable it.
  # Benchmarks run only with LTO, so their numbers match the shipped build.
  SLV_LTO: >-
    ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    || startsWith(github.ref, 'refs/tags/') || inputs.lto
    || contains(github.event.pull_request.labels.*.name, 'lto')) && 'ON' || 'OFF' }}
  # sccache stores compiled objects in the GitHub Actions cache. If the cache is down, it compiles normally.
  # Release (tag) builds don't use the cache.
  SCCACHE_GHA_ENABLED: ${{ startsWith(github.ref, 'refs/tags/') && 'false' || 'true' }}
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache
  QT_VERSION: "6.12.*"
  # Windows stays on Qt 6.8 LTS until aqtinstall can install Windows Qt 6.11+ (miurahr/aqtinstall#1047).
  QT_VERSION_WINDOWS: "6.8.*"
  APP_NAME: "StructuredLogViewer"

jobs:
  pre-commit:
    # Runs first so formatting and lint problems fail before the long builds.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Cache pre-commit environments
        # The Python version is in the key, so a new runner Python gets fresh environments.
        # The cache holds only lint tools, so it can't affect a release.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: ~/.cache/pre-commit
          key: >-
            pre-commit-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{
            hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: pip install pre-commit==4.7.0

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  clang-ci:
    # Clang 23 builds: ASan + UBSan, TSan, and coverage. The coverage leg also runs clang-tidy and uploads to Codecov.
    needs: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write # clang-tidy PR comment
      id-token: write # Codecov upload without a token
    strategy:
      fail-fast: false
      matrix:
        mode: [asan-ubsan, tsan, coverage]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Clang 23 + LLVM tools
        # Installs clang-23, clang-tidy-23, llvm-cov-23 and the sanitizer runtimes. The presets name clang-23 directly.
        # llvm.sh is kept in the repository so CI doesn't download and run a script.
        run: |
          set -euo pipefail
          chmod +x scripts/ci/llvm.sh
          sudo ./scripts/ci/llvm.sh 23 all
          clang-23 --version
          clang-tidy-23 --version
          llvm-cov-23 --version
          which clang-tidy-diff-23.py

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          # libssl-dev for OpenSSL; libxcb-cursor0 for the offscreen Qt platform.
          apt-packages: libssl-dev libxcb-cursor0
          qt-version: ${{ env.QT_VERSION }}
          qt-host: linux
          qt-arch: linux_gcc_64

      - name: Configure
        # TLS on so the TLS code is sanitized and checked by clang-tidy.
        run: cmake --preset clang-${{ matrix.mode }} -DLOGLIB_NETWORK_TLS=ON

      - name: Build
        run: cmake --build --preset clang-${{ matrix.mode }}

      - name: Collect clang-tidy include paths
        # Headers aren't in compile_commands.json, so clang-tidy needs the include paths for a changed header.
        if: matrix.mode == 'coverage'
        id: tidy-args
        run: |
          set -euo pipefail
          ARGS="$(python3 scripts/ci/tidy-include-args.py build/clang-coverage \
            library/include app/include cli/include test/common/include test/log_generator/include)"
          echo "extra-args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run clang-tidy on PR changes
        # Runs after the build, which generates the Qt moc files. Checks come from .clang-tidy. Findings go to a PR
        # comment and the step summary (inline review comments hit GitHub's rate limit). A later step fails the job.
        if: matrix.mode == 'coverage'
        id: cpp-linter
        uses: cpp-linter/cpp-linter-action@774040af57f011a5fc47911f08ff0c3059d1835a # v2.24.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "23"
          style: ""
          tidy-checks: ""
          database: build/clang-coverage
          extensions: cpp,hpp,h,cc
          files-changed-only: true
          lines-changed-only: true
          tidy-review: false
          thread-comments: true
          step-summary: true
          extra-args: ${{ steps.tidy-args.outputs.extra-args }}

      - name: Run tests
        # The test preset sets the sanitizer and coverage environment.
        run: ctest --preset clang-${{ matrix.mode }}

      - name: Merge coverage profiles + export lcov
        if: matrix.mode == 'coverage'
        run: scripts/ci/export-coverage.sh

      - name: Upload coverage to Codecov
        # Uses the Codecov GitHub App, no token. A failed upload fails the job instead of reporting zero coverage.
        # v7+ is needed: older versions can't verify the uploader's signature.
        if: matrix.mode == 'coverage'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.lcov
          fail_ci_if_error: true
          verbose: true
          use_oidc: true

      - name: Fail on clang-tidy findings
        # Last, so the tests and the coverage upload still run.
        if: matrix.mode == 'coverage' && steps.cpp-linter.outputs.clang-tidy-checks-failed != '0'
        env:
          TIDY_FAILED: ${{ steps.cpp-linter.outputs.clang-tidy-checks-failed }}
        run: |
          echo "clang-tidy reported $TIDY_FAILED finding(s) on changed lines; see the step summary." >&2
          exit 1

  build-qt-free:
    # Builds and tests `slp` with no Qt installed, so it fails if Qt leaks out of `app/`.
    needs: pre-commit
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          gcc13: true
          apt-packages: libssl-dev

      - name: Configure without Qt
        run: cmake --preset release -DSLV_BUILD_GUI=OFF -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE="$SLV_LTO"

      - name: Build
        run: cmake --build --preset release

      - name: Run tests
        run: ctest --preset release

  build-linux:
    # The oldest supported runner, so the AppImage works on Ubuntu 22.04 and other distributions of that age.
    needs: pre-commit
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # Qt 6.10+ has a single Wayland platform plugin.
      EXTRA_PLATFORM_PLUGINS: "libqwayland.so"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          gcc13: true
          # libfuse2 runs AppImages, libxcb-cursor0 is needed by the offscreen Qt platform, zsync makes the update
          # file, and patchelf sets the slp tarball's library path.
          apt-packages: libfuse2 libxcb-cursor0 zsync libssl-dev patchelf
          qt-version: ${{ env.QT_VERSION }}
          qt-host: linux
          qt-arch: linux_gcc_64

      - name: Configure
        # TLS is always on in published builds.
        run: cmake --preset release -DLOGLIB_NETWORK_TLS=ON -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE="$SLV_LTO"

      - name: Build
        run: cmake --build --preset release

      - name: Assert slp does not link Qt
        run: scripts/ci/assert-no-qt.sh build/release/bin/Release/slp

      - name: Run unit tests
        run: ctest --preset release

      - name: Run parser benchmarks
        if: env.SLV_LTO == 'ON'
        run: ctest --preset release-benchmark

      - name: Package AppImage
        run: scripts/ci/package-appimage.sh

      - name: Check AppImage
        run: scripts/ci/check-appimage.sh

      - name: Package slp tarball
        run: scripts/ci/package-slp-tarball.sh

      - name: Check slp tarball
        run: scripts/ci/check-slp-tarball.sh "$SLP_TARBALL"

      - name: Compute SHA256 checksums
        run: scripts/ci/write-checksums.sh "$APP_NAME"-*.AppImage "$APP_NAME"-*.AppImage.zsync "$SLP_TARBALL"

      - name: Upload artifact
        # No `if: always()`: after a failed build, the missing files would add a second, misleading error.
        # PR artifacts are kept 7 days; 0 means the repository default.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APP_NAME }}-linux
          path: |
            ${{ env.APP_NAME }}-*.AppImage
            ${{ env.APP_NAME }}-*.AppImage.zsync
            ${{ env.APP_NAME }}-*.AppImage.sha256
            ${{ env.APP_NAME }}-*.AppImage.zsync.sha256
            slp-*-linux-x86_64.tar.gz
            slp-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 0 }}

  build-windows:
    needs: pre-commit
    runs-on: windows-latest
    timeout-minutes: 70
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          qt-version: ${{ env.QT_VERSION_WINDOWS }}
          qt-host: windows
          qt-arch: win64_msvc2022_64

      - name: Set up MSVC environment
        # Finds Visual Studio with vswhere, because the runner image has switched editions before.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Locate OpenSSL
        run: scripts/ci/find-openssl.ps1

      - name: Configure
        # TLS is always on in published builds.
        run: cmake --preset release -DLOGLIB_NETWORK_TLS=ON -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE="$env:SLV_LTO"

      - name: Build
        run: cmake --build --preset release

      - name: Assert slp does not link Qt
        run: |
          $slp = "build\release\bin\Release\slp.exe"
          if (-not (Test-Path $slp)) { throw "slp.exe was not built" }
          $deps = & dumpbin /dependents $slp | Out-String
          if ($deps -match 'Qt6') { throw "slp links Qt: $deps" }

      - name: Run unit tests
        run: ctest --preset release

      - name: Run parser benchmarks
        if: env.SLV_LTO == 'ON'
        run: ctest --preset release-benchmark

      - name: Package application
        run: scripts/ci/package-windows.ps1

      - name: Check packaged application
        run: scripts/ci/check-windows-package.ps1

      - name: Compute SHA256 checksums
        shell: bash
        run: bash scripts/ci/write-checksums.sh "$APP_NAME.zip"

      - name: Upload artifact
        # Same choices as build-linux.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APP_NAME }}-windows
          path: |
            ${{ env.APP_NAME }}.zip
            ${{ env.APP_NAME }}.zip.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 0 }}

  build-macos:
    needs: pre-commit
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          qt-version: ${{ env.QT_VERSION }}
          qt-host: mac
          qt-arch: clang_64

      - name: Locate OpenSSL
        run: scripts/ci/find-openssl.sh

      - name: Configure
        # TLS is always on in published builds.
        run: cmake --preset release -DLOGLIB_NETWORK_TLS=ON -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE="$SLV_LTO"

      - name: Build
        run: cmake --build --preset release

      - name: Assert slp does not link Qt
        run: scripts/ci/assert-no-qt.sh build/release/bin/Release/slp

      - name: Run unit tests
        run: ctest --preset release

      - name: Run parser benchmarks
        if: env.SLV_LTO == 'ON'
        run: ctest --preset release-benchmark

      - name: Package DMG
        run: scripts/ci/package-macos.sh

      - name: Check DMG
        run: scripts/ci/check-macos-dmg.sh

      - name: Compute SHA256 checksums
        run: scripts/ci/write-checksums.sh "$APP_NAME.dmg"

      - name: Upload artifact
        # Same choices as build-linux.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APP_NAME }}-macos
          path: |
            ${{ env.APP_NAME }}.dmg
            ${{ env.APP_NAME }}.dmg.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 0 }}

  release:
    # Publishes one GitHub Release after every job passes, so a tag never gets a partial release.
    # This is the only job that can write to the repository.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [clang-ci, build-qt-free, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ env.APP_NAME }}-*
          path: dist
          merge-multiple: true

      - name: Release binaries
        # Creates the release, or replaces its files when the job is re-run.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |-
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          fi
