name: Set up build
description: >-
  Installs the shared toolchain for a CMake preset build: optional apt
  packages and GCC 13, optional Qt, CMake + Ninja, and sccache. The calling
  job checks out the repository first.

inputs:
  qt-version:
    description: Qt version spec for install-qt-action; empty skips Qt.
    default: ""
  qt-host:
    description: Qt host (linux, windows, mac).
    default: ""
  qt-arch:
    description: Qt architecture, e.g. linux_gcc_64.
    default: ""
  gcc13:
    description: >-
      Install GCC 13 from the ubuntu-toolchain-r PPA and make it the default
      gcc/g++. Ubuntu 22.04 ships only GCC 10 and 12, and the code needs
      libstdc++ 13 for <format>.
    default: "false"
  apt-packages:
    description: Space-separated apt packages to install (Linux only).
    default: ""

runs:
  using: composite
  steps:
    - name: Install apt packages
      if: runner.os == 'Linux' && (inputs.gcc13 == 'true' || inputs.apt-packages != '')
      shell: bash
      env:
        GCC13: ${{ inputs.gcc13 }}
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: |
        set -euo pipefail
        PACKAGES="$APT_PACKAGES"
        if [ "$GCC13" = "true" ]; then
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          PACKAGES="gcc-13 g++-13 $PACKAGES"
        fi
        sudo apt-get update
        # Word splitting is intended: one package per word.
        # shellcheck disable=SC2086
        sudo apt-get install -y $PACKAGES
        if [ "$GCC13" = "true" ]; then
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
        fi

    - name: Install Qt
      if: inputs.qt-version != ''
      uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
      with:
        version: ${{ inputs.qt-version }}
        host: ${{ inputs.qt-host }}
        target: desktop
        arch: ${{ inputs.qt-arch }}
        # Tag builds publish releases, so they download Qt fresh.
        cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

    - name: Install CMake and Ninja
      uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4

    - name: Set up sccache
      # The workflow sets SCCACHE_GHA_ENABLED and the CMake launcher variables.
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: "v0.18.0"
