name: Set up build
description: Installs apt packages, GCC 13, Qt, CMake + Ninja, and sccache. Run it after checkout.

inputs:
  qt-version:
    description: Qt version for install-qt-action. Empty skips Qt.
    default: ""
  qt-host:
    description: Qt host (linux, windows, mac).
    default: ""
  qt-arch:
    description: Qt architecture, e.g. linux_gcc_64.
    default: ""
  gcc13:
    description: Install GCC 13 and make it the default. Ubuntu 22.04 has only GCC 10 and 12; `<format>` needs 13.
    default: "false"
  apt-packages:
    description: Space-separated apt packages (Linux only).
    default: ""

runs:
  using: composite
  steps:
    - name: Install apt packages
      if: runner.os == 'Linux' && (inputs.gcc13 == 'true' || inputs.apt-packages != '')
      shell: bash
      env:
        GCC13: ${{ inputs.gcc13 }}
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: |
        set -euo pipefail
        PACKAGES="$APT_PACKAGES"
        if [ "$GCC13" = "true" ]; then
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          PACKAGES="gcc-13 g++-13 $PACKAGES"
        fi
        sudo apt-get update
        # shellcheck disable=SC2086 # one package per word
        sudo apt-get install -y $PACKAGES
        if [ "$GCC13" = "true" ]; then
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
        fi

    - name: Install Qt
      if: inputs.qt-version != ''
      uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
      with:
        version: ${{ inputs.qt-version }}
        host: ${{ inputs.qt-host }}
        target: desktop
        arch: ${{ inputs.qt-arch }}
        # Release (tag) builds don't use caches.
        cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

    - name: Install CMake and Ninja
      uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4

    - name: Set up sccache
      # The workflow's env enables it and sets it as the CMake compiler launcher.
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: "v0.18.0"
