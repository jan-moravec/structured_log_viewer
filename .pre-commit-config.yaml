repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 0.28.0
    hooks:
      - id: gersemi
        args: [--in-place, --line-length, "120", --no-warn-about-unknown-commands]

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-footnote

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words-list=merrors,worstcase"]

  - repo: local
    hooks:
      - id: no-loglib-internal-from-app
        name: Forbid loglib/internal includes from app and test/app
        language: python
        entry: python scripts/check-loglib-internal-includes.py
        pass_filenames: false
        files: '^(app|test/app)/.*\.(h|hpp|cpp)$'
