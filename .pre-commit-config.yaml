repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 0.29.2
    hooks:
      - id: gersemi
        args: [--in-place, --line-length, "120", --no-warn-about-unknown-commands]

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        exclude: ^test/cli/golden/
        additional_dependencies:
          - mdformat-gfm
          - mdformat-footnote

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words-list=merrors,unparseable,worstcase"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        # Not .clang-format or .clang-tidy, which keep their own layout.
        files: \.ya?ml$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]
        files: \.ya?ml$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # Upstream LLVM installer, copied unchanged.
        exclude: ^scripts/ci/llvm\.sh$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        # The online audits need a GitHub token.
        args: [--offline]

  - repo: local
    hooks:
      - id: no-loglib-internal-from-app
        name: Enforce loglib public/internal header policy
        language: python
        entry: python scripts/check-loglib-internal-includes.py
        pass_filenames: false
        files: '^(app|test/app|library/include)/.*\.(h|hpp|cpp)$'
